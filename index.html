<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Concert Database</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 側邊欄 -->
    <aside class="sidebar">

        <h1>🎫</h1>
        <h2>My Concert<br>Database</h2>

        <nav>
            <a href="#" class="active">🏠 首頁</a>
            <a href="#">🎤 演唱會</a>
            <a href="#">🛍️ 周邊</a>
            <a href="#">🔍 查詢</a>
        </nav>

        <div class="sidebar-bottom">
            <a href="#">➕ 新增資料</a>
        </div>

    </aside>


    <!-- 主要內容 -->
    <main class="main-content">

        <header>
            <h2>🏠 首頁</h2>
            <p>記錄每一場值得記住的演唱會。</p>
        </header>


        <!-- 下一場演唱會 -->
        <section class="upcoming">

            <h2>⏰ 即將到來的演唱會</h2>

            <div class="concert-card">

                <div class="concert-image">
                    <p>演唱會主視覺</p>
                </div>

                <div class="concert-info">

                    <p class="label">NEXT CONCERT</p>

                    <h1>SUPER JUNIOR</h1>

                    <h2>SUPER SHOW 10</h2>

                    <p>📅 2026 / 10 / 18</p>
                    <p>📍 Taipei Dome</p>

                    <div class="countdown">
                        <strong>28</strong>
                        <span>天</span>
                    </div>

                    <div class="ticket-status">
                        🎫 已購票
                    </div>

                </div>

            </div>

        </section>


        <!-- 快速功能 -->
        <section class="quick-actions">

            <h2>快速操作</h2>

            <div class="action-container">

                <button>➕ 新增演唱會</button>

                <button>➕ 新增周邊</button>

                <button>🔍 查詢資料</button>

            </div>

        </section>


        <!-- 最近紀錄 -->
        <section class="recent">

            <h2>最近紀錄</h2>

            <p>目前還沒有資料。</p>

        </section>

    </main>
    <script src="script.js"></script>

</body>

</html>
